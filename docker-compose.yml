services:
  ollama:
    image: ollama/ollama
    platform: linux/arm64
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # 同時推論リクエスト数を1に制限（熱暴走防止）
      - OLLAMA_NUM_PARALLEL=1
      # モデルをメモリに保持する時間（分）。0=推論後すぐ解放でメモリ節約
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 24G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  ollama-init:
    image: ollama/ollama
    platform: linux/arm64
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-qwen2.5vl:latest}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  app:
    build:
      context: .
      platforms:
        - linux/arm64
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./app:/app/app:ro
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  ollama_data:
